name: Murshid push notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: murshid-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check repos and send pushes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notify.cjs

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain notify-state.json)" ]; then
            git config user.name "murshid-notifications"
            git config user.email "actions@github.com"
            git add notify-state.json
            git commit -m "Update notification state"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
